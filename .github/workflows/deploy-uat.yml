name: Deploy Frontend UAT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-uat
  cancel-in-progress: false

env:
  ENVIRONMENT: uat
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_FRONTEND_REPOSITORY: ${{ vars.UAT_ECR_FRONTEND_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.UAT_ECS_CLUSTER }}
  ECS_FRONTEND_SERVICE: ${{ vars.UAT_ECS_FRONTEND_SERVICE }}
  FRONTEND_CONTAINER_NAME: ${{ vars.UAT_FRONTEND_CONTAINER_NAME || 'frontend' }}
  API_BACKEND_URL: ${{ vars.UAT_API_BACKEND_URL }}

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          API_BACKEND_URL: ${{ env.API_BACKEND_URL }}

  deploy:
    name: Deploy frontend to AWS UAT
    runs-on: ubuntu-latest
    environment: UAT
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.UAT_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        id: frontend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: uat-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg API_BACKEND_URL="$API_BACKEND_URL" \
            -t "$IMAGE_URI" \
            .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download frontend task definition
        run: |
          FRONTEND_TASK_DEFINITION_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_FRONTEND_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          aws ecs describe-task-definition \
            --task-definition "$FRONTEND_TASK_DEFINITION_ARN" \
            --query taskDefinition \
            > frontend-task-definition.json

      - name: Render frontend task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: ${{ env.FRONTEND_CONTAINER_NAME }}
          image: ${{ steps.frontend-image.outputs.image }}
          environment-variables: |
            NODE_ENV=production
            API_BACKEND_URL=${{ env.API_BACKEND_URL }}

      - name: Deploy frontend ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
