<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>Your verification code</title>
  <!-- Placeholders: {{otp}} {{expiryMinutes}} -->
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    @media screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f6f8f9;color:#121c21;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#f6f8f9;">
    Your verification code is {{otp}}. It expires in {{expiryMinutes}} minutes.
    &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f6f8f9" style="background-color:#f6f8f9;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">
          <tr>
            <td style="border:1px solid #dce2e5;border-radius:12px;background-color:#ffffff;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#052229" class="px" style="background-color:#052229;background-image:linear-gradient(160deg,#052229 0%,#07505a 100%);padding:22px 28px;border-radius:12px 12px 0 0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="32" height="32" bgcolor="#085d68" align="center" valign="middle" style="width:32px;height:32px;background-color:#085d68;border-radius:6px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:32px;font-weight:700;color:#ffffff;">L</td>
                        <td width="10" style="width:10px;font-size:0;line-height:0;">&nbsp;</td>
                        <td style="font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;font-weight:600;letter-spacing:-0.01em;color:#ffffff;">LoanPortal</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td height="3" bgcolor="#3cd7dd" style="height:3px;background-color:#3cd7dd;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
                <tr>
                  <td class="px" style="padding:32px 28px 8px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                    <p style="margin:0 0 10px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#085d68;">Verification</p>
                    <h1 style="margin:0 0 12px;font-size:24px;line-height:30px;font-weight:600;letter-spacing:-0.02em;color:#121c21;">Your verification code</h1>
                    <p style="margin:0 0 8px;font-size:14px;line-height:22px;color:#121c21;">Hello,</p>
                    <p style="margin:0;font-size:14px;line-height:22px;color:#4c5a61;">Your verification code is:</p>
                  </td>
                </tr>
                <tr>
                  <td class="px" align="center" style="padding:20px 28px 8px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#e6f3f4" style="background-color:#e6f3f4;border-radius:8px;padding:16px 28px;font-family:Consolas,'Courier New',monospace;font-size:28px;line-height:36px;font-weight:700;letter-spacing:6px;color:#085d68;">
                          {{otp}}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td class="px" style="padding:8px 28px 28px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                    <p style="margin:0;padding:12px 14px;background-color:#fdf3dd;border-radius:8px;font-size:13px;line-height:20px;color:#ab5f07;">
                      This code expires in {{expiryMinutes}} minutes.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
